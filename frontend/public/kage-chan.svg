    <circle cx="66" cy="78" r="6" fill="#2d3532" />
    <circle cx="70" cy="74" r="2.5" fill="white" />
    
    <circle cx="96" cy="78" r="16" fill="white" />
    <circle cx="94" cy="78" r="6" fill="#2d3532" />
    <circle cx="98" cy="74" r="2.5" fill="white" />
  </g>

  <path d="M72 45 C 72 40, 88 40, 88 45 C 88 50, 72 50, 72 45 Z" fill="#4a9c68" />
